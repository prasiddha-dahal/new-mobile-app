# Code generation config.
#
# NOTE ON JSON KEY CASING — do not add a global `field_rename` here.
# The backend is mixed: almost every model is camelCase (`therapistId`,
# `patientName`, `mediaUrls`, `newDate`), but the auth models are snake_case
# (`access_token`, `token_type`, `resend_after`, `new_password`).
# A blanket rename silently corrupts one half or the other — notably it would
# null out the login token. So Dart field names map 1:1 to JSON by default, and
# the handful of snake_case auth fields carry an explicit @JsonKey(name: ...).
targets:
  $default:
    builders:
      json_serializable:
        options:
          create_factory: true
          create_to_json: true
          explicit_to_json: true

      retrofit_generator:
        options:
          include_if_null: false
